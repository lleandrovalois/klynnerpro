services:
  klynnerpro:
    build: .
    container_name: klynnerpro
    restart: always
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      - PORT=8000
      - ADMIN_KEY=${ADMIN_KEY:-klynneradmin}
      - SMTP_HOST=${SMTP_HOST:-}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_USER=${SMTP_USER:-}
      - SMTP_PASSWORD=${SMTP_PASSWORD:-}
      - SMTP_FROM=${SMTP_FROM:-Klynner Suite <contato@klynner.com.br>}
      - SMTP_USE_TLS=${SMTP_USE_TLS:-true}
      - SMTP_USE_SSL=${SMTP_USE_SSL:-false}
      - SMTP_TIMEOUT=${SMTP_TIMEOUT:-15.0}
    volumes:
      - ./data:/app/data
      - ./temp_workspaces:/app/temp_workspaces
